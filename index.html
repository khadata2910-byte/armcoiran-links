<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123a50">
  <meta name="description" content="راه‌های ارتباط با آرم پایپ در تلگرام، بله و روبیکا">
  <title>ارتباط با آرم پایپ</title>
  <style>
    :root { --navy:#123a50; --muted:#607482; --bg:#f1f5f9; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:24px 16px;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(145deg,#e8eef3,#f7f9fb);
      color:#17384a; font-family:Tahoma, Arial, sans-serif;
    }
    main {
      width:100%; max-width:430px; background:#fff; border-radius:26px;
      padding:26px 22px; box-shadow:0 18px 55px rgba(18,58,80,.12);
      text-align:center;
    }
    .brand {
      background:var(--navy); color:#fff; border-radius:20px;
      padding:23px 16px; margin-bottom:26px;
    }
    .brand h1 { margin:0 0 8px; font-size:32px; letter-spacing:.2px; }
    .brand p { margin:0; color:#d5e6ed; font-size:14px; }
    h2 { font-size:22px; margin:0 0 10px; }
    .intro { color:var(--muted); line-height:1.9; font-size:14px; margin:0 0 22px; }
    .links { display:grid; gap:12px; }
    .link {
      display:flex; align-items:center; justify-content:center; gap:10px;
      color:#fff; text-decoration:none; padding:15px 16px; border-radius:13px;
      font-size:16px; font-weight:700; transition:transform .15s, opacity .15s;
    }
    .link:hover { transform:translateY(-1px); opacity:.94; }
    .telegram { background:#229ed9; }
    .bale { background:#239b50; }
    .rubika { background:#d93d78; }
    .icon { width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; }
    footer { color:#71808a; font-size:12px; line-height:1.8; margin-top:24px; }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>آرم پایپ</h1>
      <p>لوله و اتصالات</p>
    </header>
    <h2>ارتباط با آرم پایپ</h2>
    <p class="intro">برای ارتباط با ما، پیام‌رسان موردنظر خود را انتخاب کنید.</p>
    <nav class="links" aria-label="پیام‌رسان‌ها">
      <a class="link telegram" href="https://t.me/armcoiran" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">➤</span> ورود به تلگرام
      </a>
      <a class="link bale" href="https://ble.ir/armcoiran" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">●</span> ورود به بله
      </a>
      <a class="link rubika" href="https://rubika.ir/armcoiran" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">✦</span> ورود به روبیکا
      </a>
    </nav>
    <footer>آرم پایپ | همراه شما در تأمین لوله و اتصالات</footer>
  </main>
</body>
</html>
